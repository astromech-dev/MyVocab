<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyVocab</title>
<meta name="description" content="Your own words from your own lessons — learn and review them every day.">
<meta name="theme-color" content="#FBFAF8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyVocab">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <span class="brand">MyVocab</span>
    <button class="btn btn-link" data-open="add">+ Add words</button>
  </header>

  <div id="deckbar" class="deckbar"></div>

  <main id="screen" class="screen" aria-live="polite"></main>
</div>

<div id="sheet" class="sheet" hidden></div>

<noscript>
  <p style="padding:2rem;font:16px system-ui">MyVocab needs JavaScript to run.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
